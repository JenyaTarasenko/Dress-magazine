{% extends "shop/base.html" %}
{% load static %}

{% block content %}
<div class="mt-[50px]">

    {% for c in categories %}

    <li class="flex items-center gap-5 mb-5 text-blue-800 hover:text-blue-900">
        <a href="{{ c.get_absolute_url }}">
            {{ c.name }}
        </a>
    </li>

    {% endfor %}
    <!-- Вывод категорий товара  -->
    <!-- вывод продуктов -->
    {% for product in products %}
    <div class="item">
        <a href="{{ product.get_absolute_url }}">
            <img src="{{ product.image.url }}" style="width: 300px; height: 300px; object-fit: cover;">
        </a>
        <a href="{{ product.get_absolute_url }}">{{ product.name }}</a>
        <br>
        ${{ product.price }}
        <!-- форма для добавления товара в корзину -->
        <form action="{% url 'cart:cart_add' product.id %}" method="post">
            {{ cart_product_form }}
            {% csrf_token %}
            <input type="submit" value="Add to cart">
        </form>
        <!-- форма для добавления товара в корзину -->
    </div>
    {% endfor %}

</div>

{% endblock %}
